name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      accept_4d:
        description: Run unsigned source/compiler/packed-component tool4d harness with the default pinned runtime
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_sha:
        description: Exact normalized commit to build
        type: string
        default: ''
      release_call:
        description: Release caller performs mandatory 4D acceptance separately
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.configuration.outputs.matrix }}
      initialized: ${{ steps.configuration.outputs.initialized }}
      language: ${{ steps.configuration.outputs.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated reference icons
        run: python scripts/generate_icons.py --check
      - name: Static and initializer tests (no CLI toolchains)
        env:
          TEST_CLI_LANGUAGE: none
        run: python -m unittest discover -s tests -v
      - name: Read configured native matrix
        id: configuration
        run: python scripts/ci_config.py matrix

  native:
    needs: configuration
    if: needs.configuration.outputs.initialized == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TEST_CLI_LANGUAGE: ${{ matrix.language }}
      CLI_TARGET: ${{ matrix.target }}
      CLI_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
          cache: false
      - name: Set up Rust 1.99.1 only when selected
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Select Rust 1.99.1
        if: matrix.language == 'rust'
        run: rustup default 1.99.1
      - name: Native build and protocol smoke tests
        run: python scripts/build_cli.py --target "$CLI_TARGET" --language "$CLI_LANGUAGE"
        shell: bash
      - name: Selected CLI integration tests
        run: python -m unittest discover -s tests -p test_cli.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*
            !build/${{ matrix.target }}/cargo/**
            !build/${{ matrix.target }}/cmake/**
          if-no-files-found: error
          retention-days: 7

  assembly:
    needs: [configuration, native]
    if: needs.configuration.outputs.initialized == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Assemble universal macOS and x64 Windows resources
        id: assemble
        run: python scripts/ci_config.py assemble
      - uses: actions/upload-artifact@v4
        with:
          name: component-resources
          path: ${{ steps.assemble.outputs.resources }}
          if-no-files-found: error
          retention-days: 7
      - name: Download pinned free tool4D for optional branch and PR integration tests
        if: (vars.FOURD_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.accept_4d)) && github.ref_type != 'tag' && !inputs.release_call
        env:
          TOOL4D_URL: ${{ !inputs.accept_4d && vars.TOOL4D_URL || '' }}
          TOOL4D_SHA256: ${{ !inputs.accept_4d && vars.TOOL4D_SHA256 || '' }}
        run: python scripts/ci_config.py download-tool4d
      - name: Require tool4d source/compiler/exact unpacked compiled-package harness checks
        id: acceptance
        if: (vars.FOURD_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.accept_4d)) && github.ref_type != 'tag' && !inputs.release_call
        shell: bash
        run: |
          set -o pipefail
          python scripts/accept_local.py --root . --repository "$GITHUB_REPOSITORY" \
            --tool4d .tools/tool4d.app/Contents/MacOS/tool4d 2>&1 | tee build/4d-acceptance.log
          python scripts/publish_prerelease.py --write-native-evidence
      - name: Capture one component-free shutdown probe after acceptance failure
        if: failure() && steps.acceptance.outcome == 'failure'
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          root = pathlib.Path("build/hosted-shutdown-probe")
          project = root / "Project"
          methods = project / "Sources/Methods"
          methods.mkdir(parents=True)
          (project / "Probe.4DProject").write_text(json.dumps({"compatibilityVersion": 2060}) + "\n")
          marker = (root / "marker.json").resolve()
          (methods / "Probe.4dm").write_text(
              'var $parameter : Text\nvar $ignored : Integer\n'
              '$ignored:=Get database parameter(User param value; $parameter)\n'
              'File($parameter; fk posix path).setText("reached Return")\nreturn\n',
              encoding="utf-8")
          command = [str(pathlib.Path(".tools/tool4d.app/Contents/MacOS/tool4d").resolve()),
                     str((project / "Probe.4DProject").resolve()), "--dataless",
                     "--skip-onstartup", "--startup-method=Probe", "--user-param=" + str(marker)]
          report = {"scope": "single component-free diagnostic; never acceptance"}
          try:
              result = subprocess.run(command, capture_output=True, timeout=60)
              (root / "stdout.log").write_bytes(result.stdout)
              (root / "stderr.log").write_bytes(result.stderr)
              report.update(returncode=result.returncode, marker_written=marker.is_file(),
                            status="passed" if result.returncode == 0 and marker.is_file() else "failed")
          except subprocess.TimeoutExpired as error:
              report.update(status="failed", reason="timeout")
              (root / "stdout.log").write_bytes(error.stdout or b"")
              (root / "stderr.log").write_bytes(error.stderr or b"")
          (root / "result.json").write_text(json.dumps(report, indent=2) + "\n")
          sys.exit(0 if report["status"] == "passed" else 1)
      - name: Preserve 4D acceptance evidence, including failures
        if: always() && steps.acceptance.outcome != 'skipped' && steps.acceptance.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: four-d-acceptance
          path: |
            dist/*.zip
            dist/*.acceptance.json
            dist/*.native-evidence.json
            build/acceptance.json
            build/4d-acceptance.log
            build/host-status.json
            build/source-host-status.json
            build/compiled-host-status.json
            build/compile-status.json
            build/macos-arm64/build-manifest.json
            build/macos-x64/build-manifest.json
            build/windows-x64/build-manifest.json
            build/hosted-shutdown-probe/**
          if-no-files-found: error
          retention-days: 30
