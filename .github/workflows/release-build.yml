name: Validate compiled release candidate
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version_tag:
        type: string
        required: true
      source_bundle:
        type: string
        default: ''
      dry_run:
        description: Run native/compiler/package gates without signing or publishing
        type: boolean
        default: false
    secrets:
      APPLE_DEVELOPER_ID_CERTIFICATE:
        required: false
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      NOTARYTOOL_APPLE_ID:
        required: false
      NOTARYTOOL_PASSWORD:
        required: false
      NOTARYTOOL_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_bundle && github.sha || inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: inputs.source_bundle != ''
        with:
          name: ${{ inputs.source_bundle }}
          path: build/release-candidate
      - name: Restore exact unpushed version candidate
        if: inputs.source_bundle != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/bump_release.py restore --directory build/release-candidate --expected-sha "$SOURCE_SHA"
      - name: Validate source, version and production scope
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.version_tag }}
          SOURCE_BUNDLE: ${{ inputs.source_bundle }}
          DRY_RUN: ${{ inputs.dry_run }}
          FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
        shell: python
        run: |
          import os, pathlib, sys
          sys.path.insert(0, "scripts")
          from build_provenance import commit
          from ci_config import load_config
          from bump_release import validate_candidate, release_channel
          root = pathlib.Path(".").resolve()
          sha = os.environ["SOURCE_SHA"]
          if commit(root) != sha:
              raise ValueError("release checkout differs from the resolved commit")
          release_channel(os.environ["RELEASE_TAG"])
          load_config(root, initialized=True, tag=os.environ["RELEASE_TAG"],
                      repository=os.environ["GITHUB_REPOSITORY"])
          if os.environ["FOURD_ENABLED"] != "true":
              raise ValueError("explicit FOURD_ENABLED=true release opt-in required")
          production = os.environ["DRY_RUN"] != "true"
          if production and os.environ["GITHUB_EVENT_NAME"] not in ("push", "workflow_dispatch"):
              raise ValueError("production release builds cannot run on PR events")
          if os.environ["SOURCE_BUNDLE"]:
              metadata = validate_candidate(root, root / "build/release-candidate", sha, production=production)
              if metadata["tag"] != os.environ["RELEASE_TAG"]:
                  raise ValueError("candidate tag differs from release tag")

  native:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      source_bundle: ${{ inputs.source_bundle }}
      release_call: true

  compile:
    needs: [gate, native]
    runs-on: macos-15
    env:
      FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
      TOOL4D_URL: ''
      TOOL4D_SHA256: ''
      RELEASE_TAG: ${{ inputs.version_tag }}
      RELEASE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_bundle && github.sha || inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: inputs.source_bundle != ''
        with:
          name: ${{ inputs.source_bundle }}
          path: build/release-candidate
      - name: Restore exact unpushed version candidate
        if: inputs.source_bundle != ''
        run: python scripts/bump_release.py restore --directory build/release-candidate --expected-sha "$RELEASE_SHA"
      - run: python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Download SHA-256-verified tool4D
        run: python scripts/ci_config.py download-tool4d
      - name: Require tool4d source/compiler/exact unpacked compiled-package harness checks
        shell: bash
        run: |
          set -o pipefail
          python scripts/accept_local.py --root . --repository "$GITHUB_REPOSITORY" \
            --tool4d .tools/tool4d.app/Contents/MacOS/tool4d 2>&1 | tee build/release-acceptance.log
          python scripts/publish_prerelease.py --write-native-evidence
      - name: Require candidate invariants after native and compiler outputs
        if: inputs.source_bundle != ''
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, "scripts")
          from bump_release import validate_candidate
          status = subprocess.check_output(["git", "status", "--short"]).decode("utf-8")
          print("Post-build source status:\n" + (status or "(clean)"))
          validate_candidate(pathlib.Path(".").resolve(), pathlib.Path("build/release-candidate"),
                             os.environ["RELEASE_SHA"], production=os.environ["DRY_RUN"] != "true")
      - name: Sign, notarize and verify the exact production distribution
        if: '!inputs.dry_run'
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          SOURCE_BUNDLE: ${{ inputs.source_bundle }}
        shell: bash
        run: |
          args=()
          if [[ -n "$SOURCE_BUNDLE" ]]; then args+=(--candidate build/release-candidate); fi
          python scripts/sign_release.py --root . --tool4d .tools/tool4d.app/Contents/MacOS/tool4d \
            --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" "${args[@]}"
      - name: Always remove generated signing credentials and detach images
        if: always() && !inputs.dry_run
        run: python scripts/sign_release.py --root . --cleanup
      - name: Validate final signed-byte publication gates
        if: '!inputs.dry_run'
        run: >-
          python scripts/publish_prerelease.py --validate-signed
          --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
      - name: Validate exact unsigned dry-run artifact and provenance
        if: inputs.dry_run
        shell: python
        run: |
          import os, pathlib, sys
          sys.path.insert(0, "scripts")
          from publish_prerelease import presign_assets
          presign_assets(pathlib.Path(".").resolve(), os.environ["RELEASE_SHA"])
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.acceptance.json
            dist/*.native-evidence.json
            dist/*.signing.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve raw release evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            build/acceptance.json
            build/*-status.json
            build/release-acceptance.log
            build/*/build-manifest.json
            dist/*.signing.json
          if-no-files-found: warn
          retention-days: 30
