name: Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: semantic versioning
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publish must be run on main." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute next version from the latest release tag
        id: version
        env:
          MODE: ${{ inputs.mode }}
        run: python scripts/bump_release.py next --mode "$MODE"
      - name: Set version and commit to main
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/bump_release.py apply --version "$VERSION"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json template.json tests/host/contract.json component/CMYK/Documentation/Classes/Converter.md
            git commit -m "Release $VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  build:
    needs: [version, native]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Download SHA-256-verified tool4d
        run: python scripts/ci_config.py download-tool4d
      - name: Build, compile, package and host-test the component
        shell: bash
        run: |
          set -o pipefail
          python scripts/accept_local.py --root . --repository "$GITHUB_REPOSITORY" \
            --tool4d .tools/tool4d.app/Contents/MacOS/tool4d 2>&1 | tee build/release-acceptance.log
          python scripts/publish_release.py --write-native-evidence
      - name: Codesign and notarize
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: >-
          python scripts/sign_release.py --root . --tool4d .tools/tool4d.app/Contents/MacOS/tool4d
          --tag "$VERSION" --expected-sha "$SHA"
      - name: Remove signing keychain and detach images
        if: always()
        run: python scripts/sign_release.py --root . --cleanup
      - name: Validate signed assets
        run: python scripts/publish_release.py --validate-signed --version "$VERSION" --expected-sha "$SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.acceptance.json
            dist/*.native-evidence.json
            dist/*.signing.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            build/acceptance.json
            build/*-status.json
            build/release-acceptance.log
            build/*/build-manifest.json
            dist/*.signing.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create tag and GitHub release with the signed assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: python scripts/publish_release.py --version "$VERSION" --expected-sha "$SHA"
