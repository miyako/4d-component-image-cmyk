name: Release compiled component
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing matching version tag (v<SemVer>); never creates a tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.release_ref.outputs.sha }}
      release_tag: ${{ steps.release_ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve existing version tag to an immutable commit
        id: release_ref
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: >-
          python scripts/release_ref.py resolve
          --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE"
          --ref-name "$GITHUB_REF_NAME" --version-tag "$VERSION_TAG"
          --event-sha "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.sha }}
      - name: Require initialized matching repository, version tag and explicit 4D opt-in
        env:
          FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"

  native:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.gate.outputs.source_sha }}
      release_call: true

  compile:
    needs: [gate, native]
    runs-on: macos-15
    env:
      FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
      TOOL4D_URL: ${{ vars.TOOL4D_URL }}
      TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Download SHA-256-verified tool4D
        run: python scripts/ci_config.py download-tool4d
      - name: Require source, compiler and exact unpacked compiled-host acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/accept_local.py --root . --repository "$GITHUB_REPOSITORY" \
            --tool4d .tools/tool4d.app/Contents/MacOS/tool4d 2>&1 | tee build/release-acceptance.log
          python scripts/publish_prerelease.py --write-native-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-release
          path: |
            dist/*.zip
            dist/*.acceptance.json
            dist/*.native-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve raw release evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            build/acceptance.json
            build/*-status.json
            build/release-acceptance.log
            build/*/build-manifest.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [gate, compile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-release
          path: dist
      - name: Publish only after compilation and packaging succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          git fetch --force --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python scripts/release_ref.py verify --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
          python scripts/publish_prerelease.py --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
